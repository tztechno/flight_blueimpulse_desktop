<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>航空自衛隊 松島基地 (RJST) ブルーインパルス 3Dフライトシミュレーター — Blue Impulse Aerobatics Simulator</title>
    <meta name="description" content="航空自衛隊松島基地(RJST)を舞台に、T-4ブルーインパルスの1機または5機編隊によるダイヤモンドテイクオフ、デルタループ、スタークロス、レベルサンライズ等のアクロバット展示飛行、コックピット視点、5機全体視点、手動操縦を体験できる3Dフライトシミュレーター。" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- 3D WebGL Canvas Container (Full Resolution) -->
      <div id="viewport-container"></div>

      <!-- Scaled UI Overlay Layer -->
      <div id="ui-layer">
        <!-- Top Header Bar -->
        <header class="top-header">
          <div class="brand-section">
            <span class="airport-badge" id="header-title">航空自衛隊 松島基地 (RJST)</span>
            <span class="runway-badge" id="header-runway-tag">Runway 07/25 (2,700m) & 15/33</span>
          </div>

          <!-- Center: Camera View Selector -->
          <div class="header-center" id="view-selector-container"></div>

          <!-- Right: Utility Tools (UI Scale, Manual, Language) -->
          <div class="header-tools">
            <div class="ui-scale-toolbar" title="UI縮尺・ズーム調整 (ショートカット: [ / ] キー)">
              <span class="ui-scale-icon">🖥️</span>
              <button class="ui-scale-btn-step" id="ui-scale-dec-btn" title="UI縮尺を縮小 [ [ キー]">-</button>
              <span class="ui-scale-indicator" id="ui-scale-indicator" title="現在のUI縮尺">85%</span>
              <button class="ui-scale-btn-step" id="ui-scale-inc-btn" title="UI縮尺を拡大 [ ] キー]">+</button>
              <button class="ui-scale-btn-reset" id="ui-scale-reset-btn" title="標準縮尺(85%)に戻す [0 キー]">↺</button>
            </div>
            <!-- Manual Modal Button -->
            <button class="manual-btn" id="manual-modal-btn" title="取扱説明書・操作マニュアル [M]">📖 マニュアル</button>
            <!-- Language Toggle Button -->
            <button class="lang-btn" id="lang-toggle-btn">JA / EN</button>
          </div>
        </header>

      <!-- Primary Flight Display (PFD HUD - Left) -->
      <div class="pfd-container" id="pfd-container">
        <div class="pfd-header" id="pfd-header" title="PFD HUDを折りたたむ / 展開 [H]">
          <div class="pfd-title-group">
            <span class="pfd-badge">HUD</span>
            <span class="pfd-title">PFD INSTRUMENTS</span>
          </div>
          <button class="pfd-toggle-btn" id="pfd-collapse-btn" title="PFD HUDを折りたたむ / 展開 [H]">◀</button>
        </div>
        <div class="pfd-body" id="pfd-body">
          <canvas id="pfd-canvas" width="250" height="250"></canvas>
        </div>
      </div>

      <!-- Right Flight Control & Formations Panel -->
      <div class="control-panel-container" id="control-panel-container"></div>

      <!-- Dynamic Flight Instruction / Guidance HUD Banner (Manual Mode) -->
      <div class="flight-instruction-container" id="flight-instruction-container"></div>

      <!-- In-App Manual Modal Overlay -->
      <div class="manual-modal-overlay" id="manual-modal-overlay" style="display: none;">
        <div class="manual-modal-card">
          <div class="manual-modal-header">
            <div class="manual-header-title-group">
              <span class="manual-modal-badge">RJST FLIGHT MANUAL</span>
              <h2 class="manual-modal-title" id="manual-modal-heading">ブルーインパルス 3Dフライトシミュレーター 取扱説明書</h2>
            </div>
            <button class="manual-close-btn" id="manual-close-btn" title="閉じる [Esc]">✖</button>
          </div>

          <div class="manual-tabs-bar" id="manual-tabs-bar">
            <button class="manual-tab-btn active" data-manual-tab="quickstart">🚀 クイックスタート</button>
            <button class="manual-tab-btn" data-manual-tab="controls">🕹️ 操縦・キー操作</button>
            <button class="manual-tab-btn" data-manual-tab="modes">👥 5機 / 1機モード</button>
            <button class="manual-tab-btn" data-manual-tab="routines">✈️ 7大公式演目</button>
          </div>

          <div class="manual-modal-body" id="manual-modal-body">
            <!-- Dynamic Tab Content Injected by JS -->
          </div>
        </div>
      </div>

      <!-- Bottom Telemetry & Timeline Dock -->
      <div id="telemetry-container"></div>

      <!-- Proximity Warning Badge (Near Miss Alert) -->
      <div id="proximity-warning-badge" class="proximity-warning-badge hidden">
        ⚠️ PROXIMITY ALERT — 僚機近接注意！
      </div>

      <!-- Crash / Mid-Air Collision Game Over Overlay -->
      <div id="crash-overlay" class="crash-overlay hidden">
        <div class="crash-backdrop"></div>
        <div class="crash-card">
          <div class="crash-icon-wrap" id="crash-icon-wrap">
            <svg viewBox="0 0 24 24" width="44" height="44" stroke="currentColor" stroke-width="2" fill="none">
              <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
              <line x1="12" y1="9" x2="12" y2="13"/>
              <line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
          </div>
          <h2 class="crash-title" id="crash-title-text">MID-AIR COLLISION</h2>
          <p class="crash-subtitle" id="crash-subtitle-text">編隊僚機との空中接触・衝突 / OUT!</p>
          <div class="crash-stats-grid">
            <div class="crash-stat">
              <span class="cs-lbl" id="crash-lbl-speed">激突・接触速度</span>
              <span class="cs-val" id="crash-speed">155 KT</span>
            </div>
            <div class="crash-stat">
              <span class="cs-lbl" id="crash-lbl-elev">高度 / 距離</span>
              <span class="cs-val" id="crash-elev">320 M</span>
            </div>
            <div class="crash-stat">
              <span class="cs-lbl" id="crash-lbl-loc">衝突相手 / エリア</span>
              <span class="cs-val" id="crash-loc">#1 リーダー機</span>
            </div>
            <div class="crash-stat">
              <span class="cs-lbl" id="crash-lbl-sync">編隊シンクロ率</span>
              <span class="cs-val" id="crash-sync">88% (Rank A)</span>
            </div>
            <div class="crash-stat">
              <span class="cs-lbl" id="crash-lbl-time">飛行継続時間</span>
              <span class="cs-val" id="crash-time">42.5s</span>
            </div>
            <div class="crash-stat">
              <span class="cs-lbl" id="crash-lbl-role">操縦機体</span>
              <span class="cs-val" id="crash-role">#2 左翼機</span>
            </div>
          </div>
          <button id="crash-restart-btn" class="crash-restart-btn">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
              <path d="M3 3v5h5"/>
            </svg>
            <span id="crash-restart-text">フライト再開 [R]</span>
          </button>
        </div>
      </div>
      <!-- End of #ui-layer -->
    </div>
    <!-- End of #app -->

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
